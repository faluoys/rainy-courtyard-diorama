{

function init(){
/* ---------- renderer / scene ---------- */

/* ---------- textures ---------- */
function cv(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}
function rep(t,x,y){const c=t.clone();c.needsUpdate=true;c.wrapS=c.wrapT=THREE.RepeatWrapping;c.repeat.set(x,y);return c}
scene.background=cv(2,256,(g)=>{const gr=g.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#05070f');gr.addColorStop(0.55,'#141a3a');gr.addColorStop(1,'#2b1b40');g.fillStyle=gr;g.fillRect(0,0,2,256)});

const glowTex=cv(128,128,(g)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(0.22,'rgba(255,255,255,0.5)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128)});
const brickTex=cv(256,256,(g,w,h)=>{g.fillStyle='#232934';g.fillRect(0,0,w,h);const bh=16,bw=44;for(let r=0;r<h/bh;r++){const off=(r%2)*bw/2;for(let c=-1;c<w/bw+1;c++){g.fillStyle=`hsl(${215+rnd(-8,8)},${12+rnd(0,8)}%,${rnd(30,40)}%)`;g.fillRect(c*bw+off+2,r*bh+2,bw-4,bh-4)}}
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(0.6,'rgba(10,14,24,0.15)');gr.addColorStop(1,'rgba(10,14,24,0.6)');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<16;i++){g.fillStyle='rgba(8,10,20,0.16)';g.fillRect(rnd(0,w),0,rnd(2,5),rnd(60,h))}

function slabTex(l1,l2,hue){return cv(256,256,(g,w,h)=>{g.fillStyle='#12151d';g.fillRect(0,0,w,h);for(let r=0;r<4;r++){let x=-rnd(0,40);while(x<w){const rw=rnd(50,90);g.fillStyle=`hsl(${hue+rnd(-10,10)},${rnd(8,16)}%,${rnd(l1,l2)}%)`;g.fillRect(x+2,r*64+2,rw-4,60);x+=rw}}for(let i=0;i<30;i++){g.fillStyle='rgba(70,120,70,0.25)';g.fillRect(rnd(0,w),rnd(0,h),rnd(2,8),2)}})}

const tileTex=cv(128,128,(g,w,h)=>{g.fillStyle='#1b202a';g.fillRect(0,0,w,h);for(let i=0;i<4;i++){const gr=g.createLinearGradient(i*32,0,i*32+32,0);gr.addColorStop(0,'#232836');gr.addColorStop(0.5,'#4a5469');gr.addColorStop(1,'#232836');g.fillStyle=gr;g.fillRect(i*32+2,0,28,h)}g.fillStyle='rgba(8,10,16,0.65)';for(let j=0;j<4;j++)g.fillRect(0,j*32,w,3)});
const woodTex=cv(256,256,(g,w,h)=>{for(let i=0;i<8;i++){g.fillStyle=`hsl(${24+rnd(-3,3)},${35+rnd(0,10)}%,${30+rnd(0,8)}%)`;g.fillRect(0,i*32,w,32);g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(0,i*32,w,2);for(let k=0;k<6;k++){g.fillStyle='rgba(0,0,0,0.08)';g.fillRect(0,i*32+rnd(4,28),w,1)}}});
function latTex(col,paper){return cv(256,256,(g,w,h)=>{if(paper){g.fillStyle=paper;g.fillRect(0,0,w,h)}g.strokeStyle=col;g.lineWidth=10;g.strokeRect(5,5,w-10,h-10);g.lineWidth=6;const s=w/4;for(let i=0;i<4;i++)for(let j=0;j<4;j++){const x=i*s,y=j*s;g.strokeRect(x+s*.22,y+s*.22,s*.56,s*.56);g.beginPath();g.moveTo(x+s/2,y);g.lineTo(x+s/2,y+s*.22);g.moveTo(x+s/2,y+s*.78);g.lineTo(x+s/2,y+s);g.moveTo(x,y+s/2);g.lineTo(x+s*.22,y+s/2);g.moveTo(x+s*.78,y+s/2);g.lineTo(x+s,y+s/2);g.stroke()}})}
const latT=latTex('#5a2a1c'),paperT=latTex('#3a1c12','#f6dca6');
const blindTex=cv(64,256,(g,w,h)=>{for(let y=0;y<h;y+=8){g.fillStyle=`hsl(40,${40+rnd(0,10)}%,${45+rnd(0,10)}%)`;g.fillRect(0,y,w,6)}g.fillStyle='#3a2a18';g.fillRect(10,0,3,h);g.fillRect(w-13,0,3,h)});

const inkTex=cv(256,512,(g,w,h)=>{g.fillStyle='#efe6cf';g.fillRect(0,0,w,h);for(let k=0;k<3;k++){g.fillStyle=`rgba(40,48,60,${0.22+k*0.2})`;g.beginPath();g.moveTo(0,h);for(let x=0;x<=w;x+=16)g.lineTo(x,h*(0.42+k*0.12)+Math.sin(x*0.03+k*2)*40+rnd(-8,8));g.lineTo(w,h);g.closePath();g.fill()}g.fillStyle='#b8322c';g.fillRect(w-56,40,26,26);g.fillStyle='#222';g.font=`700 40px ${FONT}`;g.textAlign='center';[...'山雨欲来'].forEach((c,i)=>g.fillText(c,42,70+i*46))});

function txt(str,o={}){const w=o.w||512,h=o.h||256;return cv(w,h,(g)=>{if(o.bg){g.fillStyle=o.bg;g.fillRect(0,0,w,h)}if(o.border){g.strokeStyle=o.border;g.lineWidth=o.bw||8;g.strokeRect(8,8,w-16,h-16)}
 g.fillStyle=o.fg||'#fff';g.textAlign='center';g.textBaseline='middle';if(o.glow){g.shadowColor=o.glow;g.shadowBlur=o.blur||18}
 const fs=o.fs||100;g.font=`${o.fw||700} ${fs}px ${FONT}`;
 if(o.v){const ch=[...str];ch.forEach((c,i)=>g.fillText(c,w/2,(i+0.5)*h/ch.length))}else{const ls=str.split('\n');ls.forEach((l,i)=>g.fillText(l,w/2,h/2+(i-(ls.length-1)/2)*fs*1.25))}
 if(o.scan){g.shadowBlur=0;g.fillStyle='rgba(0,0,0,0.28)';for(let y=0;y<h;y+=5)g.fillRect(0,y,w,2)}})}

/* ---------- materials & helpers ---------- */
const MC={};
function T(color,o){if(!o){return MC[color]||(MC[color]=new THREE.MeshToonMaterial({color,gradientMap:gmap}))}return new THREE.MeshToonMaterial(Object.assign({color,gradientMap:gmap},o))}
const M=m=>typeof m==='number'?T(m):m;

const water=new THREE.MeshPhongMaterial({color:0x0b1222,shininess:180,specular:0xa8b8ff});
const base=new THREE.Group();scene.add(base);
function outline(m,t=0.035){const g=m.geometry;g.computeBoundingBox();const s=new THREE.Vector3();g.boundingBox.getSize(s);const f=v=>v<0.02?1:(v+t*2)/v;const o=new THREE.Mesh(g,OUT);o.scale.set(f(s.x),f(s.y),f(s.z));o.raycast=()=>{};m.add(o);return m}
function add(p,geo,mat,x,y,z,o={}){const m=new THREE.Mesh(geo,M(mat));m.position.set(x,y,z);if(o.rx)m.rotation.x=o.rx;if(o.ry)m.rotation.y=o.ry;if(o.rz)m.rotation.z=o.rz;m.castShadow=o.cs!==false;m.receiveShadow=true;if(o.ol!==false)outline(m,o.t);p.add(m);return m}
function box(p,w,h,d,mat,x,y,z,o){return add(p,new THREE.BoxGeometry(w,h,d),mat,x,y+h/2,z,o)}
function cyl(p,rt,rb,h,mat,x,y,z,o,seg=16){return add(p,new THREE.CylinderGeometry(rt,rb,h,seg),mat,x,y+h/2,z,o)}
function lathe(p,pts,mat,x,y,z,o){const g=new THREE.LatheGeometry(pts.map(a=>new THREE.Vector2(a[0],a[1])),20);g.computeBoundingBox();const h=g.boundingBox.max.y;g.translate(0,-h/2,0);const m=add(p,g,mat,x,y+h/2,z,o);m.material.side=DS;return m}

const seasonMats=[];function smat(cols,o){const m=T(cols[0],o);seasonMats.push({m,c:cols.map(c=>new THREE.Color(c))});return m}
const banMats=[smat([0x6ab865,0x2f8a44,0xb09a3a,0x6a7a55],{side:DS}),smat([0x8ad27a,0x4aa850,0xd08a2e,0x7a8a60],{side:DS})];
const potM1=smat([0x5aa85a,0x3f8a48,0xa07a30,0x5a6a4a],{flatShading:true}),potM2=smat([0x7cc070,0x5aa85a,0xc89038,0x6a7a58],{flatShading:true});

const neons=[],lanterns=[],holos=[],streaks=[],leaves=[],sways=[],drips=[],slides=[],blinks=[],eyes=[],flick=[],steam=[];
function neon(a,b,color,w=0.05,ph){const A=new THREE.Vector3(...a),B=new THREE.Vector3(...b),len=A.distanceTo(B),mid=A.clone().add(B).multiplyScalar(0.5);

 const m1=new THREE.MeshBasicMaterial({color:c.clone()}),m2=new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.22,blending:ADD,depthWrite:false});
 const core=new THREE.Mesh(new THREE.BoxGeometry(w,w,len),m1),halo=new THREE.Mesh(new THREE.BoxGeometry(w*4,w*4,len+w*2),m2);
 for(const m of[core,halo]){m.position.copy(mid);if(Math.abs(B.y-A.y)/len>0.99)m.rotation.x=Math.PI/2;else m.lookAt(B);base.add(m)}

function streak(x,y,z,color,w,l,op=0.32,rz=0){const m=new THREE.MeshBasicMaterial({map:glowTex,color,transparent:true,opacity:op,blending:ADD,depthWrite:false});const s=new THREE.Mesh(new THREE.PlaneGeometry(w,l),m);s.rotation.set(-Math.PI/2,0,rz);s.position.set(x,y,z);base.add(s);streaks.push({m,op,ph:Math.random()*6})}
function holo(tex,w,h,x,y,z,ry,color,op=0.85){const m=basic(tex,{color,opacity:op,blending:ADD,depthWrite:false});const me=plane(base,w,h,m,x,y,z,ry);holos.push({me,m,op,x0:x,y0:y,z0:z,g:0});glow(base,x,y,z,color,Math.max(w,h)*1.6,0.18);return me}
function lantern(p,x,y,z,s=1,color=0xe23a2a){const g=new THREE.Group();g.position.set(x,y,z);p.add(g);
 cyl(g,0.012,0.012,0.3,0x1a1a1a,0,-0.3,0,{ol:false,cs:false},4);
 const mat=T(color,{emissive:0xff6a3a,emissiveIntensity:0.85});const b=new THREE.Mesh(new THREE.SphereGeometry(0.28*s,16,12),mat);b.scale.y=0.85;b.position.y=-0.3-0.26*s;outline(b,0.03);g.add(b);

 cyl(g,0.02,0.05,0.28*s,0xe8b040,0,-0.3-0.52*s-0.33*s,0,{ol:false});

function panel(p,w,h,x,y,z,ry=0,paper=false){const g=new THREE.Group();g.position.set(x,y+h/2,z);g.rotation.y=ry;p.add(g);
 const t=rep(paper?paperT:latT,Math.max(1,Math.round(w/0.9)),Math.max(1,Math.round(h/0.9)));
 const mat=paper?T(0xffffff,{map:t,emissiveMap:t,emissive:0xffa050,emissiveIntensity:0.6,side:DS}):T(0xffffff,{map:t,alphaTest:0.5,side:DS});
 const pm=new THREE.Mesh(new THREE.PlaneGeometry(w,h),mat);pm.castShadow=!paper;g.add(pm);

if(THREE.EffectComposer&&THREE.UnrealBloomPass&&THREE.RenderPass){composer=new THREE.EffectComposer(renderer);composer.addPass(new THREE.RenderPass(scene,camera));composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.85,0.5,0.42))}
function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w/h<1?52:36;camera.updateProjectionMatrix();renderer.setSize(w,h);if(composer)composer.setSize(w,h)}
function applyQuality(q){const C=QUAL[q];state.q=q;const pr=Math.min(devicePixelRatio,C.pr);renderer.setPixelRatio(pr);if(composer&&composer.setPixelRatio)composer.setPixelRatio(pr);
 moon.castShadow=C.sh>0;if(C.sh&&moon.shadow.mapSize.x!==C.sh){moon.shadow.mapSize.set(C.sh,C.sh);if(moon.shadow.map){moon.shadow.map.dispose();moon.shadow.map=null}}
 useBloom=C.bloom&&!!composer;resize();syncUI()}
addEventListener('resize',resize);

/* ---------- controls UI ---------- */
const $=q=>document.querySelector(q),fab=$('#fab'),pnl=$('#panel'),toastEl=$('#toast'),autoBtn=$('#auto');
let toastTimer=0,idle=0,autoT=0,pi=0;
const PRESETS=[['rain','spring'],['clear','spring'],['storm','summer'],['clear','summer'],['rain','autumn'],['clear','autumn'],['snow','winter'],['clear','winter']];
function toast(m){toastEl.textContent=m;toastEl.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('on'),1800)}
function syncUI(){for(const b of pnl.querySelectorAll('[data-k]'))b.setAttribute('aria-pressed',String(state[b.dataset.k]===b.dataset.v));autoBtn.setAttribute('aria-pressed',String(state.auto))}
function manual(){const was=state.auto;state.auto=false;return was?' · 自动轮换已关':''}
function setW(w){const n=manual();state.w=w;syncUI();toast(`${W_LABEL[w]} · ${S_LABEL[state.s]}${n}`)}
function setS(s){const n=manual();state.s=s;syncUI();toast(`${W_LABEL[state.w]} · ${S_LABEL[s]}${n}`)}
function setQ(q){state.userQ=true;applyQuality(q);toast(`画质：${QUAL[q].name}`)}
function setAuto(v){state.auto=v;autoT=0;syncUI();toast(v?'自动轮换：开':'自动轮换：关')}
pnl.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;idle=0;if(b===autoBtn)return setAuto(!state.auto);const k=b.dataset.k,v=b.dataset.v;if(k==='w')setW(v);else if(k==='s')setS(v);else if(k==='q')setQ(v)});
fab.addEventListener('click',()=>{pnl.hidden=!pnl.hidden;idle=0;fab.setAttribute('aria-expanded',String(!pnl.hidden))});
renderer.domElement.addEventListener('pointerdown',()=>{if(!pnl.hidden){pnl.hidden=true;fab.setAttribute('aria-expanded','false')}});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const k=e.key.toLowerCase(),wi='1234'.indexOf(k),si='5678'.indexOf(k);
 if(k.length!==1)return;if(wi>=0)setW(W_KEYS[wi]);else if(si>=0)setS(S_KEYS[si]);else if(k==='q'){const o=['high','mid','low'];setQ(o[(o.indexOf(state.q)+1)%3])}else if(k==='a')setAuto(!state.auto);else if(k==='h'){fab.hidden=!fab.hidden;pnl.hidden=true}});
applyQuality(state.q);

/* ---------- animate ---------- */
const clock=new THREE.Clock(),fcol=new THREE.Color(),tc=new THREE.Color();let dPrev=new THREE.Vector3(9,4.3,3),fpsN=0,fpsT=0,warm=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),0.05),t=clock.elapsedTime;
 if(state.auto){autoT+=dt;if(autoT>40){autoT=0;pi=(pi+1)%PRESETS.length;state.w=PRESETS[pi][0];state.s=PRESETS[pi][1];syncUI();toast(`${W_LABEL[state.w]} · ${S_LABEL[state.s]}`)}}
 if(!pnl.hidden){idle+=dt;if(idle>8){pnl.hidden=true;fab.setAttribute('aria-expanded','false')}}
 warm+=dt;if(warm>4&&!state.userQ&&state.q!=='low'){fpsN++;fpsT+=dt;if(fpsT>3){if(fpsN/fpsT<28){applyQuality(state.q==='high'?'mid':'low');toast(`画质已自动调整为「${Q().name}」`)}fpsN=0;fpsT=0}}
 const kw=Math.min(1,dt*0.5);for(const k of W_KEYS)wA[k]+=((k===state.w?1:0)-wA[k])*kw;for(const k of S_KEYS)sA[k]+=((k===state.s?1:0)-sA[k])*kw;
 const rainL=mix('rain'),spd=mix('spd'),wind=mix('wind'),drip=mix('drip'),snowL=wA.snow;
 fcol.setRGB(0,0,0);for(const k of W_KEYS)fcol.add(tc.copy(WP[k].fc).multiplyScalar(wA[k]));scene.fog.color.copy(fcol);scene.fog.near=mix('fn');scene.fog.far=mix('ff');
 // seasons
 for(const sm of seasonMats){fcol.setRGB(0,0,0);S_KEYS.forEach((k,i)=>fcol.add(tc.copy(sm.c[i]).multiplyScalar(sA[k])));sm.m.color.copy(fcol)}
 const cs=1-0.93*sA.winter;for(const c of canopy)c.scale.setScalar(cs);
 const petA=Math.min(1,sA.spring+sA.autumn);petals.visible=petA>0.02;petals.material.opacity=petA;petals.material.color.copy(PINK).multiplyScalar(sA.spring).add(tc.copy(ORANGE).multiplyScalar(sA.autumn));
 const pAct=Math.floor(PN*petA);petG.setDrawRange(0,pAct);for(let i=0;i<pAct;i++){const k=i*3;pp[k+1]-=(0.45+rainL*0.9)*dt;pp[k]+=(Math.sin(t*1.5+pph[i])*0.45+wind*0.35)*dt;pp[k+2]+=Math.cos(t*1.1+pph[i])*0.3*dt;if(pp[k+1]<gy(pp[k],pp[k+2])||pp[k]>12.8)resetPet(i,true)}petG.attributes.position.needsUpdate=true;
 glMat.color.copy(petals.material.color);glMat.opacity=(sA.spring*0.8+sA.autumn)*(1-acc);groundLeaves.visible=glMat.opacity>0.02;
 const fA=sA.summer*(1-rainL*0.7)*(1-snowL);for(const f of flies){f.s.position.set(f.x+Math.sin(t*f.sp+f.ph)*0.7,f.y+Math.sin(t*f.sp*1.3+f.ph*2)*0.3,f.z+Math.cos(t*f.sp*0.8+f.ph)*0.7);const b=0.5+0.5*Math.sin(t*2.6+f.ph*3);f.s.material.opacity=fA*b*b*0.95}
 // rain
 const act=Math.floor(Q().rain*rainL);rain.visible=act>0;rg.setDrawRange(0,act*2);rain.material.opacity=0.32+wA.storm*0.22;
 for(let i=0;i<act;i++){const k=i*6;rp[k+1]-=rv[i]*spd*dt;rp[k]+=wind*dt;if(rp[k]>12.7)rp[k]-=25.3;const x=rp[k],y=rp[k+1],z=rp[k+2];let hit=y<gy(x,z);
  if(!hit)for(const c of covers)if(x>c[0]&&x<c[1]&&z>c[2]&&z<c[3]&&y<c[4]+0.4){hit=true;break}
  if(hit){if(y<0.3&&Math.random()<0.05)ripple(x,gy(x,z),z,rnd(0.12,0.22));resetDrop(i,true)}
  rp[k+3]=rp[k]-wind*0.045*rl[i];rp[k+4]=rp[k+1]+rl[i];rp[k+5]=rp[k+2]}
 rg.attributes.position.needsUpdate=true;
 const rr=rainL*(1-acc);
 for(let n=0;n<3;n++)if(Math.random()<0.9*rr){const p=puddles[Math.random()*puddles.length|0];const a=Math.random()*6.28,r=Math.sqrt(Math.random())*0.85;ripple(p[0]+Math.cos(a)*r*p[2],p[4],p[1]+Math.sin(a)*r*p[3],rnd(0.1,0.25))}
 if(Math.random()<0.6*rr)ripple(rnd(-12.3,6.6),0.0,6.78,rnd(0.08,0.18));if(Math.random()<0.5*rr)ripple(6.78,0.0,rnd(-12.3,6.5),rnd(0.08,0.18));if(Math.random()<0.35*rr)ripple(rnd(-7,1.4),0.02,2.45,rnd(0.06,0.14));
 if(Math.random()<0.25*rr)ripple(-0.6+rnd(-0.3,0.3),vatY,-5.1+rnd(-0.3,0.3),rnd(0.08,0.16));
 // snow
 const sAct=Math.floor(Q().snow*snowL);snowPts.visible=sAct>0;snG.setDrawRange(0,sAct);snowPts.material.opacity=Math.min(1,snowL*1.2)*0.9;
 for(let i=0;i<sAct;i++){const k=i*3;sp[k+1]-=sv[i]*dt;sp[k]+=(Math.sin(t*0.8+sph[i])*0.35+wind*0.3)*dt;sp[k+2]+=Math.cos(t*0.6+sph[i])*0.25*dt;const x=sp[k],y=sp[k+1],z=sp[k+2];let hit=y<gy(x,z)+0.05||x>12.8;
  if(!hit)for(const c of covers)if(x>c[0]&&x<c[1]&&z>c[2]&&z<c[3]&&y<c[4]+0.5){hit=true;break}if(hit)resetFlake(i,true)}
 snG.attributes.position.needsUpdate=true;
 acc=Math.max(0,Math.min(1,acc+(snowL>0.5?dt*0.035:-dt*0.05)));snowMat.opacity=acc*0.95;snowMat.visible=acc>0.01;snowGM.opacity=acc*0.9;snowGM.visible=acc>0.01;
 water.color.copy(waterDark).lerp(ice,acc*0.55);
 // lightning & moon
 if(wA.storm>0.6){nextFlash-=dt;if(nextFlash<0){flashT=0.6;makeBolt();nextFlash=rnd(4,11)}}
 let fl=0;if(flashT>0){flashT-=dt;fl=flashT>0.45?1:flashT>0.36?0.15:flashT>0.26?0.85:Math.max(0,flashT/0.26)*0.5}
 flashL.intensity=fl*2.4;bolt.material.opacity=fl>0.3?1:0;boltGlow.material.opacity=fl*0.45;hemi.intensity=mix('hemi')+fl*0.9;
 moonS.material.opacity=wA.clear*0.95;
 // ripples, drips, slides
 for(const r of rips){if(r.t>=1)continue;r.t+=dt/0.75;const k=Math.min(r.t,1);r.m.scale.setScalar(r.s*(0.15+k));r.m.material.opacity=0.55*(1-k);if(k>=1)r.m.visible=false}
 for(const d of drips){if(d.d>0){d.d-=dt;d.m.visible=false;continue}d.m.visible=true;d.v+=9.8*dt;d.y-=d.v*dt;d.m.position.set(d.x,d.y,d.z);if(d.y<=d.y1){if(acc<0.5)ripple(d.x,d.ry,d.z,rnd(0.18,0.3));d.y=d.y0;d.v=0;d.d=rnd(0.3,1.8)/Math.max(0.03,drip)}}
 slideMat.opacity=0.8*Math.min(1,rainL*1.6+wA.clear*0.3);
 for(const s of slides){s.v=Math.random()<0.015?rnd(0.6,1.4):Math.max(0.04,s.v*0.96);s.y-=s.v*dt;if(s.y<s.yBot)s.y=s.yTop;s.m.position.set(s.x,s.y,s.z)}
 // lights & motion
 for(const n of neons){let k=0.72+0.28*Math.sin(t*n.sp+n.ph);if(n.off>0){n.off-=dt;k=0.15+Math.random()*0.3}else if(Math.random()<0.0004)n.off=rnd(0.08,0.4);n.m1.color.copy(n.c).multiplyScalar(k);n.m2.opacity=0.24*k}
 const sw=0.6+wind*0.3;
 for(const l of lanterns){const f=0.85+0.15*nz(t+l.ph);l.mat.emissiveIntensity=0.85*f;l.sp.material.opacity=0.5*f;l.g.rotation.z=Math.sin(t*1.3+l.ph)*0.06*sw;l.g.rotation.x=Math.sin(t*0.9+l.ph*2)*0.04*sw}
 for(const h of holos){if(h.g>0){h.g-=dt;h.me.position.x=h.x0+rnd(-0.06,0.06);h.m.opacity=h.op*rnd(0.2,1);h.me.scale.x=rnd(0.94,1.06)}else{if(Math.random()<0.006)h.g=rnd(0.08,0.3);h.me.position.x=h.x0;h.me.scale.x=1;h.m.opacity=h.op*(0.85+0.15*Math.sin(t*3+h.x0))}}
 tp.rotation.y=t*0.8;tp.position.y=1.55+Math.sin(t*1.6)*0.04;
 for(const s of streaks)s.m.opacity=s.op*(0.8+0.2*Math.sin(t*2.3+s.ph)+0.08*nz(t*0.5+s.ph))*(1-acc*0.6)*(0.7+0.3*Math.min(1,rainL+wA.clear));
 for(const l of leaves)l.o.rotation.x=l.b+(Math.sin(t*1.7+l.ph)*l.a+Math.sin(t*4.1+l.ph)*0.02)*sw;
 for(const s of sways){const v=s.b+(Math.sin(t*1.3+s.ph)*s.a+Math.sin(t*3.1+s.ph)*s.a*0.3)*sw;if(s.ax==='x')s.o.rotation.x=v;else s.o.rotation.z=v}
 for(const b of blinks)b.s.material.opacity=((t+b.o)%b.p)<0.35?0.95:0.08;
 for(const e of eyes)e.head.rotation.y=Math.sin(t*0.45+e.ph)*0.7;
 for(const f of flick){if(f.t>0){f.t-=dt;const v=Math.random()<0.5?0.2:1;f.l.intensity=f.i*v;f.s.material.opacity=f.o*v}else{f.l.intensity=f.i;f.s.material.opacity=f.o;if(Math.random()<0.003)f.t=rnd(0.15,0.6)}}
 for(const s of steam){const k=(t*0.35+s.o)%1;s.s.position.set(s.x+Math.sin(k*6+s.o*9)*0.12,s.y+k*1.3,s.z);s.s.material.opacity=0.22*Math.sin(k*Math.PI);s.s.scale.setScalar(0.25+k*0.5)}
 const cyc=(t%14)/14,op=cyc<0.15?0:cyc<0.35?(cyc-0.15)/0.2:cyc<0.6?1:cyc<0.8?1-(cyc-0.6)/0.2:0,e=op*op*(3-2*op);slider.position.z=-2.5-1.45*e;
 const c2=((t+5)%19)/19,o2=c2<0.2?0:c2<0.4?(c2-0.2)/0.2:c2<0.65?1:c2<0.85?1-(c2-0.65)/0.2:0;doorPiv.rotation.y=1.15*o2*o2*(3-2*o2);
 const p1=new THREE.Vector3(9.2+1.8*Math.sin(t*0.21),4.3+0.25*Math.sin(t*0.9),3.2+3.2*Math.sin(t*0.13+1));dr1.g.position.copy(p1);const dv=p1.clone().sub(dPrev);if(dv.lengthSq()>1e-6)dr1.g.rotation.y+=((Math.atan2(dv.x,dv.z))-dr1.g.rotation.y)*0.02;dPrev=p1;dr1.g.rotation.z=Math.sin(t*0.7)*0.06;
 dr2.g.position.set(9.6+Math.sin(t*0.3)*0.15,3.9+Math.sin(t*1.1)*0.08,-9.4);dr2.g.rotation.y=t*0.1;
 for(const d of[dr1,dr2]){d.rot.forEach(r=>r.rotation.y+=dt*40);d.cone.material.opacity=0.04+0.03*Math.sin(t*3)}
 controls.update();if(useBloom)composer.render();else renderer.render(scene,camera)}
loop();
}

(async()=>{try{await Promise.race([document.fonts.load('700 64px "Noto Serif SC"',CHARS),new Promise(r=>setTimeout(r,2500))])}catch(e){}init()})();
